# MKSHOP 生产环境主站 Nginx 配置（M6-D）
# 用法：复制到 nginx/conf.d/main.conf，替换 example.com 与 php:9000
# 说明：所有域名统一走 mks_sys_url 解析（主站 vip_id=0）；多域名只需追加 server_name 或新增 subsite.conf
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/mkshop/public;
    index index.php index.html;

    client_max_body_size 50m;

    # HTTPS（示例；证书路径按实际替换）
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/ssl/example.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/example.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_session_cache shared:SSL:10m;

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/$1 last;
        }
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # 健康检查（不写访问日志，便于探针高频调用）
    location = /healthz {
        access_log off;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/healthz last;
        }
    }

    # SPA 入口 HTML 禁缓存（必须在通用静态规则之前）
    location = /admin-web/ {
        try_files /admin-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        access_log off;
    }
    location = /admin-web/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        access_log off;
    }
    location = /admin-web { return 301 /admin-web/; }

    location = /front-web/ {
        try_files /front-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        access_log off;
    }
    location = /front-web/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        access_log off;
    }
    location = /front-web { return 301 /front-web/; }

    location = /h5-web/ {
        try_files /h5-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        access_log off;
    }
    location = /h5-web/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
        access_log off;
    }
    location = /h5-web { return 301 /h5-web/; }

    location ~* ^/(admin-web|front-web|h5-web|template)/ {
        expires 7d;
        access_log off;
    }

    # 敏感文件
    location ~ /\.(env|git) { deny all; }
    location ~* \.(sql|lock|log)$ { deny all; }
    location = /install.lock { deny all; }
}
