# MKSHOP 分站 Nginx 配置（M6-D）
# 两种接入方式按需二选一：
#   A. 泛域名：*.example.com 全部指向同一站点根，分站由 mks_sys_url(vip_id>0) 解析
#   B. 独立域名：为每个分站域名复制一个 server 块，root 仍指向同一项目
#   C. 二级目录：不改 server，分站用 /shop/ 等路径前缀，系统按 vip_site.path_prefix 解析
server {
    listen 80;
    server_name *.example.com;

    root /var/www/mkshop/public;
    index index.php index.html;

    client_max_body_size 50m;

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/$1 last;
        }
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location = /healthz {
        access_log off;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/healthz last;
        }
    }

    location = /admin-web/ {
        try_files /admin-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location = /front-web/ {
        try_files /front-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }
    location ~* ^/(admin-web|front-web|h5-web|template)/ {
        expires 7d;
        access_log off;
    }

    location ~ /\.(env|git) { deny all; }
    location ~* \.(sql|lock|log)$ { deny all; }
}

