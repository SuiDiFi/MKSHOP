server {
    listen 80;
    server_name localhost;
    root /var/www/mkshop/public;
    index index.php index.html;

    client_max_body_size 50m;

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=/$1 last;
        }
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # SPA 入口 HTML 禁缓存（must 在通用静态规则之前，regex 先匹配先赢）
    location = /admin-web/ {
        try_files /admin-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        access_log off;
    }
    # 直接访问 index.html 时同样禁缓存（避免旧入口引用已删除的 hash 资源导致白屏）
    location = /admin-web/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        access_log off;
    }
    location = /admin-web {
        return 301 /admin-web/;
    }
    location = /front-web/ {
        try_files /front-web/index.html =404;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        access_log off;
    }
    location = /front-web/index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
        access_log off;
    }
    location = /front-web {
        return 301 /front-web/;
    }

    location ~* ^/(admin-web|front-web|template)/ {
        expires 7d;
        access_log off;
    }

    location ~ /\.(env|git) {
        deny all;
    }
}
