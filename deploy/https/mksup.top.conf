# MKSHOP 主机层 HTTPS 配置（mksup.top）
# 用法：deploy/scripts/https_setup.sh 签发证书后启用；证书由 acme.sh 自动续期。
# 说明：主机 nginx 只负责 TLS 终止与跳转，业务请求反代到 mkshop-nginx 容器（127.0.0.1:8080）。

server {
    listen 80;
    listen [::]:80;
    server_name mksup.top www.mksup.top vip.mksup.top;

    # Let's Encrypt HTTP-01 校验（不跳转）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mksup.top www.mksup.top vip.mksup.top;

    ssl_certificate     /etc/nginx/ssl/mksup.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mksup.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    # 根路径直达前台 SPA（P2-G，用户批准）
    location = / {
        return 302 /front-web/;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
