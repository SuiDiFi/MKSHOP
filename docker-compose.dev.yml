version: "3.8"

# =====================================================================
# MKSHOP 本地开发环境（Windows Docker Desktop）
# 用法: cp .env.compose.example .env.compose（本地口令可自定）→
#       docker compose --env-file .env.compose -f docker-compose.dev.yml up -d
# 安全基线（§5.9 后与 prod 同构）：端口只绑 127.0.0.1、口令插值（有 dev 默认值）、
# redis requirepass——从仓库直接 up 不再裸奔（历史教训见 docs/运营审查报告.md §5.9）
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: mkshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mksdev_root}
      MYSQL_DATABASE: mkshop
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mkshop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mksdev_redis}"]
    ports:
      - "127.0.0.1:63791:6379"
    volumes:
      - redis_data:/data

  php:
    build:
      context: ./deploy/docker/php
    container_name: mkshop-php
    restart: unless-stopped
    working_dir: /var/www/mkshop
    volumes:
      - .:/var/www/mkshop
      - composer_cache:/tmp/composer-cache
    environment:
      TZ: Asia/Shanghai
      COMPOSER_ALLOW_SUPERUSER: 1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.25-alpine
    container_name: mkshop-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/mkshop:ro
      - ./deploy/docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  queue:
    build:
      context: ./deploy/docker/php
    container_name: mkshop-queue
    restart: unless-stopped
    working_dir: /var/www/mkshop
    command: php think queue:listen --sleep 1 --tries 3
    volumes:
      - .:/var/www/mkshop
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - php

volumes:
  mysql_data:
  redis_data:
  composer_cache:
