version: "3.8"

# =====================================================================
# MKSHOP 生产 compose（§5.9：与 docker-compose.dev.yml 拆分）
#   - 与 dev 版同结构；差异：端口全绑 127.0.0.1、口令 ${...:?} 插值（文件内无明文）、
#     每服务 logging max-size、nginx 用生产实际在用的 dev.conf（文件名历史遗留，勿改引用）
#   - 凭据来源：/opt/mkshop/.env.compose（600，由 /root/.mkshop-credentials 生成，不入库）
#   - 启动：sh dc.sh up -d（dc.sh 已指向本文件）
#   - 变更留档：/root/backups/pre-p59-*/（原 dev compose + rollback.sh）
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: mkshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?need MYSQL_ROOT_PASSWORD in .env.compose}
      MYSQL_DATABASE: mkshop
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: mkshop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?need REDIS_PASSWORD in .env.compose}"]
    ports:
      - "127.0.0.1:63791:6379"
    volumes:
      - redis_data:/data
    logging: *logging

  php:
    build:
      context: ./deploy/docker/php
    container_name: mkshop-php
    restart: unless-stopped
    working_dir: /var/www/mkshop
    volumes:
      - .:/var/www/mkshop
      - composer_cache:/tmp/composer-cache
    environment:
      TZ: Asia/Shanghai
      COMPOSER_ALLOW_SUPERUSER: 1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    logging: *logging

  nginx:
    image: nginx:1.25-alpine
    container_name: mkshop-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/mkshop:ro
      - ./deploy/docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    logging: *logging

  queue:
    build:
      context: ./deploy/docker/php
    container_name: mkshop-queue
    restart: unless-stopped
    working_dir: /var/www/mkshop
    command: php think queue:listen --sleep 1 --tries 3
    volumes:
      - .:/var/www/mkshop
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - php
    logging: *logging

volumes:
  mysql_data:
  redis_data:
  composer_cache:
